workflows:
  android-apk:
    name: Shanika Constructions Android APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project files
        script: |
          set -e
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la
          echo "Generating Android platform:"
          flutter create --platforms=android --project-name shanika_constructions .
          echo "Checking Android folder:"
          test -d android
          ls -la android

      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze Flutter source
        script: flutter analyze --no-pub

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
