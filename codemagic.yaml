workflows:
  android-apk:
    name: Shanika Constructions Android APK
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Generate Android project files
        script: flutter create --platforms=android --project-name shanika_constructions .

      - name: Get Flutter packages
        script: flutter pub get

      - name: Analyze Flutter source
        script: flutter analyze --no-pub

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
